server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location = /build-info {
        default_type application/json;
        try_files /build.json =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
